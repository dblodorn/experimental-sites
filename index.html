<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎨 Color Chord</title>
  <meta name="description" content="Colorful balls that play chords based on their hue. Ambient music machine.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }
    #ui {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: #888; font-size: 13px; text-align: center; pointer-events: none;
      font-family: 'Helvetica Neue', sans-serif; z-index: 10;
      background: rgba(0,0,0,.6); padding: 8px 24px; border-radius: 30px;
      border: 1px solid rgba(255,255,255,.08);
    }
    #ui span { color: #ff9ff3; }
    #count { color: #54a0ff; }
  </style>
</head>
<body>
  <div id="ui">🎨 <span>color chord</span> · click to add color · <span id="count">0</span> notes</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  <script>
    const { Engine, Render, Runner, Bodies, Body, Events, Composite } = Matter;

    const engine = Engine.create();
    const w = window.innerWidth, h = window.innerHeight;
    const render = Render.create({
      element: document.body, engine,
      options: {
        width: w, height: h,
        background: '#111', wireframes: false,
        pixelRatio: window.devicePixelRatio, hasBounds: true
      }
    });

    // Sanzo Wada inspired color palette (12 colors)
    const palette = [
      { name: 'Crimson', hex: '#dc2626', note: 'C3', freq: 131 },
      { name: 'Vermilion', hex: '#ea580c', note: 'D3', freq: 147 },
      { name: 'Gold', hex: '#f59e0b', note: 'E3', freq: 165 },
      { name: 'Chartreuse', hex: '#65a30d', note: 'F3', freq: 175 },
      { name: 'Emerald', hex: '#059669', note: 'G3', freq: 196 },
      { name: 'Teal', hex: '#0d9488', note: 'A3', freq: 220 },
      { name: 'Cerulean', hex: '#2563eb', note: 'B3', freq: 247 },
      { name: 'Indigo', hex: '#4f46e5', note: 'C4', freq: 262 },
      { name: 'Violet', hex: '#7c3aed', note: 'D4', freq: 294 },
      { name: 'Magenta', hex: '#c026d3', note: 'E4', freq: 330 },
      { name: 'Rose', hex: '#e11d48', note: 'F4', freq: 349 },
      { name: 'Amber', hex: '#d97706', note: 'G4', freq: 392 },
    ];

    // Audio — ambient reverb
    const reverb = new Tone.Reverb({ decay: 30, wet: 0.7 }).toDestination();
    const delay = new Tone.FeedbackDelay('8n', 0.3).connect(reverb);

    // Chord engine: 3 oscillators per ball for a triad
    function createBallVoice(colorIdx) {
      const c = palette[colorIdx % palette.length];
      const baseFreq = c.freq;
      const third = baseFreq * (5/4);  // major third
      const fifth = baseFreq * (3/2);  // perfect fifth

      const osc1 = new Tone.Oscillator({ frequency: baseFreq, type: 'sine', volume: -12 }).connect(delay);
      const osc2 = new Tone.Oscillator({ frequency: third, type: 'sine', volume: -18 }).connect(delay);
      const osc3 = new Tone.Oscillator({ frequency: fifth, type: 'sine', volume: -20 }).connect(delay);

      return { osc1, osc2, osc3, baseFreq };
    }

    let elements = [];
    let colorIdx = 0;
    const countEl = document.getElementById('count');

    const wallOpts = { isStatic: true, render: { fillStyle: '#1a1a1a' } };
    Composite.add(engine.world, [
      Bodies.rectangle(w/2, -25, w, 50, wallOpts),
      Bodies.rectangle(w/2, h+25, w, 50, wallOpts),
      Bodies.rectangle(-25, h/2, 50, h, wallOpts),
      Bodies.rectangle(w+25, h/2, 50, h, wallOpts),
    ]);

    function createColorBall(x, y) {
      const c = palette[colorIdx % palette.length];
      const size = Math.random() * 15 + 20;

      const ball = Bodies.circle(x || Math.random()*w*0.6 + w*0.2, y || -30, size, {
        restitution: 0.6 + Math.random()*0.3, friction: 0.05, density: 0.002,
        render: {
          fillStyle: c.hex,
          strokeStyle: 'rgba(255,255,255,0.4)',
          lineWidth: 2
        },
        label: 'colorBall'
      });

      const voice = createBallVoice(colorIdx);
      elements.push({ body: ball, voice, color: c, idx: colorIdx });
      colorIdx = (colorIdx + 1) % palette.length;
      Composite.add(engine.world, ball);
      countEl.textContent = elements.length;

      // Start oscillating softly
      voice.osc1.start();
      voice.osc2.start();
      voice.osc3.start();
    }

    // Collision -> swell the chord
    Events.on(engine, 'collisionStart', (e) => {
      e.pairs.forEach(pair => {
        const a = pair.bodyA, b = pair.bodyB;
        const eA = elements.find(el => el.body === a);
        const eB = elements.find(el => el.body === b);
        if (eA && eB) {
          const speed = Math.sqrt(
            (a.velocity.x - b.velocity.x)**2 + (a.velocity.y - b.velocity.y)**2
          );
          const vol = Math.min(1, speed / 20);
          if (vol > 0.03) {
            // Swell the oscillators briefly
            [eA.voice.osc1, eA.voice.osc2, eA.voice.osc3].forEach(o => o.volume.rampTo(-6 - (1-vol)*6, 0.1));
            [eB.voice.osc1, eB.voice.osc2, eB.voice.osc3].forEach(o => o.volume.rampTo(-6 - (1-vol)*6, 0.1));
            // Fade back
            setTimeout(() => {
              [eA.voice.osc1, eA.voice.osc2, eA.voice.osc3].forEach(o => o.volume.rampTo(-12, 0.5));
              [eB.voice.osc1, eB.voice.osc2, eB.voice.osc3].forEach(o => o.volume.rampTo(-12, 0.5));
            }, 200);
          }
        }
      });
    });

    // Click to add
    render.canvas.addEventListener('click', (e) => createColorBall(e.clientX, e.clientY));

    // Space to add 3
    document.body.onkeyup = (e) => {
      if (e.key === ' ' || e.code === 'Space') {
        for (let i = 0; i < 3; i++) setTimeout(createColorBall, i * 300);
      }
    };

    // Start with 4 balls
    setTimeout(() => createColorBall(w*0.3, h*0.3), 500);
    setTimeout(() => createColorBall(w*0.7, h*0.5), 700);
    setTimeout(() => createColorBall(w*0.5, h*0.7), 900);
    setTimeout(() => createColorBall(w*0.4, h*0.4), 1100);

    Runner.run(Runner.create(), engine);
    Render.run(render);
  </script>
</body>
</html>
