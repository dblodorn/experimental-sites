<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>119 Paintings</title><meta name="description" content="119 colored canvases. Touch them. They sing."><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#1a1a1a;font-family:"Courier New",monospace}canvas{display:block}#ui{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#777;font-size:12px;text-align:center;pointer-events:none;z-index:10;background:rgba(0,0,0,.5);padding:6px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.06)}#ui span{color:#fbbf24}#nd{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:48px;pointer-events:none;font-family:Georgia,serif;z-index:5;text-align:center;transition:all .2s}</style></head><body><div id="ui">🎨 <span>119 paintings</span> · hover the swatches · each one sings</div><div id="nd">·</div><script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script><script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script><script>
const{Engine,Render,Runner,Bodies,Body,Composite}=Matter;const e=Engine.create();e.gravity.y=0;const w=innerWidth,h=innerHeight;const r=Render.create({element:document.body,engine:e,options:{width:w,height:h,background:"#1a1a1a",wireframes:false,pixelRatio:devicePixelRatio,hasBounds:true}});const notes=[];for(const o of["0","1","2","3","4","5","6","7","8"])for(const c of["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"]){notes.push(c+o);if(notes.length>=119)break;if(notes.length>=119)break}function h2h(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};const x=x=>Math.round(255*x).toString(16).padStart(2,"0");return"#"+x(f(0))+x(f(8))+x(f(4))}const rev=new Tone.Reverb({decay:60,wet:.8}).toDestination();const del=new Tone.FeedbackDelay("4n",.4).connect(rev);const ps=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sine"},envelope:{attack:.1,decay:2,sustain:.3,release:3}}).connect(del);const ms=new Tone.MetalSynth({envelope:{attack:.001,decay:.3,release:.5},harmonicity:3,resonance:600}).connect(new Tone.Reverb({decay:5,wet:.3}).toDestination());const nd=document.getElementById("nd");const cols=17,rows=7,sw=w/cols,sh=h/rows;let bodies=[],last=new Map;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c;if(i>=119)break;const hue=i/119*360,color=h2h(hue,70,50+10*(r%3)),x=c*sw+sw/2,y=r*sh+sh/2,sz=Math.min(sw,sh)*.85;const b=Bodies.rectangle(x,y,.9*sz,.9*sz,{isStatic:true,isSensor:true,render:{fillStyle:color,strokeStyle:"rgba(255,255,255,.05)",lineWidth:1},label:"s"});bodies.push(b);Composite.add(e.world,b)}r.canvas.addEventListener("mousemove",ev=>{const mx=ev.clientX,my=ev.clientY;bodies.forEach((b,i)=>{const bx=b.position.x,by=b.position.y,hf=Math.min(sw,sh)*.4;if(mx>bx-hf&&mx<bx+hf&&my>by-hf&&my<by+hf){const n=Date.now(),l=last.get(i)||0;if(n-l>300){const note=notes[i]||"C4";ps.triggerAttackRelease(note,"4n");ms.triggerAttackRelease(note,".05");nd.textContent=note;nd.style.color=b.render.fillStyle;nd.style.transform="scale(1.1)";setTimeout(()=>nd.style.transform="scale(1)",150);Body.scale(b,1.05,1.05);setTimeout(()=>Body.scale(b,.952,.952),150);last.set(i,n)}}})});r.canvas.addEventListener("click",()=>{const bn=[];for(let i=0;i<5;i++)bn.push(notes[Math.floor(119*Math.random())]||"C4");ps.triggerAttackRelease(bn,"2n");nd.textContent="✦";nd.style.color="#fff"});Runner.run(Runner.create(),e);Render.run(r)
</script></body></html>
