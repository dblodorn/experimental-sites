<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐌 Clickholes Redux</title><meta name="description" content="Click to create wormholes. Balls get sucked in."><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;font-family:"Courier New",monospace}canvas{display:block}#ui{position:fixed;top:20px;left:50%;transform:translateX(-50%);color:#888;font-size:14px;text-align:center;pointer-events:none;z-index:10;background:rgba(0,0,0,.5);padding:8px 20px;border-radius:20px;border:1px solid rgba(255,255,255,.1)}#ui span{color:#f0f}#count{color:#0ff}#wormhole-count{color:#ff0}</style></head><body><div id="ui">🕳️ Click to create a <span>wormhole</span> &nbsp;·&nbsp; <span>Space</span> to spawn &nbsp;·&nbsp; Balls: <span id="count">0</span> &nbsp;·&nbsp; Holes: <span id="wormhole-count">0</span></div><script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script><script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script><script>
const{Engine,Render,Runner,Bodies,Body,Events,Composite}=Matter;const e=Engine.create();const w=innerWidth,h=innerHeight;const r=Render.create({element:document.body,engine:e,options:{width:w,height:h,background:"#0a0a0f",wireframes:false,pixelRatio:devicePixelRatio,hasBounds:true}});const wO={isStatic:true,render:{fillStyle:"#1a1a2e",strokeStyle:"#2a2a4e",lineWidth:2}};Composite.add(e.world,[Bodies.rectangle(w/2,-25,w,50,wO),Bodies.rectangle(w/2,h+25,w,50,wO),Bodies.rectangle(-25,h/2,50,h,wO),Bodies.rectangle(w+25,h/2,50,h,wO)]);const rev=new Tone.Reverb({decay:10,wet:.6}).toDestination();const sy=new Tone.FMSynth({harmonicity:1.5,modulationIndex:2,envelope:{attack:.01,decay:.3,release:.8}}).connect(rev);const hS=new Tone.MetalSynth({envelope:{attack:.01,decay:.5,release:.3},harmonicity:8,modulationIndex:40,resonance:2e3}).connect(new Tone.Reverb({decay:3,wet:.4}).toDestination());let balls=[],holes=[];const cEl=document.getElementById("count"),hEl=document.getElementById("wormhole-count");Events.on(e,"beforeUpdate",()=>{const g=.0005;holes.forEach(h=>{balls.forEach(b=>{const dx=h.position.x-b.position.x,dy=h.position.y-b.position.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<5){const i=balls.indexOf(b);if(i>-1){balls.splice(i,1);Composite.remove(e.world,b);cEl.textContent=balls.length;sy.triggerAttackRelease(["C3","D3","E3","G3","A3","C4"][Math.floor(6*Math.random())],".1");Body.scale(h,1.05,1.05)}return}const f=g/(dist*dist+10);Body.applyForce(b,b.position,{x:dx*f,y:dy*f})})})});Events.on(e,"collisionStart",ev=>{ev.pairs.forEach(p=>{const a=p.bodyA,b=p.bodyB;if(a.label==="Ball"||b.label==="Ball"){const s=Math.min(1,Math.sqrt((a.velocity.x-b.velocity.x)**2+(a.velocity.y-b.velocity.y)**2)/20);s>.05&&hS.triggerAttackRelease(200+800*s,.05,void 0,.1+.4*s)}if(a.label==="Wormhole"||b.label==="Wormhole")hS.triggerAttackRelease(["C2","E2","G2"][Math.floor(3*Math.random())],".15")})});function cB(){const b=Bodies.circle(Math.random()*.6*w+.2*w,-30,12+15*Math.random(),{restitution:.7,friction:.05,density:.002,render:{fillStyle:["#ff006e","#fb5607","#ffbe0b","#8338ec","#3a86ff","#00bbf9"][Math.floor(6*Math.random())],strokeStyle:"#fff",lineWidth:1},label:"Ball"});balls.push(b);Composite.add(e.world,b);cEl.textContent=balls.length}function cW(x,y){const h=Bodies.circle(x,y,15,{isStatic:true,render:{fillStyle:"#000",strokeStyle:"#f0f",lineWidth:3},label:"Wormhole"});holes.push(h);Composite.add(e.world,[h,Bodies.circle(x,y,30,{isStatic:true,isSensor:true,render:{fillStyle:"transparent",strokeStyle:"rgba(255,0,255,.3)",lineWidth:1}}),Bodies.circle(x,y,45,{isStatic:true,isSensor:true,render:{fillStyle:"transparent",strokeStyle:"rgba(255,0,255,.1)",lineWidth:1}})]);hEl.textContent=holes.length;hS.triggerAttackRelease("G2",".3")}for(let i=0;i<5;i++)setTimeout(cB,200*i);r.canvas.addEventListener("click",e=>cW(e.clientX,e.clientY));document.body.onkeyup=ev=>{if(ev.key===" "||ev.code==="Space")for(let i=0;i<5;i++)setTimeout(cB,100*i)};Runner.run(Runner.create(),e);Render.run(r)
</script></body></html>
