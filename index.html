<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>☁️ Cloud Shapes</title><meta name="description" content="Pull shapes down from the sky. Each shape sings differently."><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Helvetica Neue',sans-serif;background:#87ceeb}canvas{display:block}
#ui{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:11px;text-align:center;pointer-events:none;z-index:10;background:rgba(0,0,0,.25);padding:5px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.1);text-shadow:0 1px 4px rgba(0,0,0,.2);letter-spacing:1px}
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-radius:16px;padding:10px 18px;display:flex;gap:16px;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,.1);border:1px solid rgba(255,255,255,.5);pointer-events:auto;font-size:11px;color:#555}
#controls label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#888}
#controls input[type=range]{width:60px;height:3px;accent-color:#8b5cf6;cursor:pointer}
#controls select{font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid #ddd;background:white;color:#555;cursor:pointer}
#spawn-panel{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#spawn-panel button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.25);backdrop-filter:blur(4px);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;color:rgba(255,255,255,.8)}
#spawn-panel button:hover{transform:scale(1.15);background:rgba(255,255,255,.4)}
#poop-count{position:fixed;top:50px;right:20px;z-index:15;font-size:24px;pointer-events:none;opacity:.5}
body{animation:fadeIn 1.5s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}</style></head><body>
<div id="ui">☁️ cloud shapes · drag shapes down · drop shapes on shapes</div>
<div id="poop-count">💩</div>
<div id="spawn-panel">
  <button id="btn-circle" title="drop circle">⬤</button>
  <button id="btn-triangle" title="drop triangle">▲</button>
  <button id="btn-square" title="drop square">■</button>
  <button id="btn-poop" title="drop poop">💩</button>
  <button id="btn-hexagon" title="drop hexagon">⬡</button>
</div>
<div id="controls">
  <label>reverb <input type="range" id="reverb-ctrl" min="0" max="100" value="60"></label>
  <label>pitch <select id="pitch-ctrl"><option>C3</option><option selected>D3</option><option>E3</option><option>F3</option><option>G3</option><option>A3</option><option>B3</option><option>C4</option></select></label>
  <label>decay <input type="range" id="decay-ctrl" min="0" max="100" value="40"></label>
  <label>harmonics <input type="range" id="harm-ctrl" min="0" max="100" value="50"></label>
  <label>volume <input type="range" id="vol-ctrl" min="0" max="100" value="70"></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
<script>
const{Engine,Render,Runner,Bodies,Body,Events,Composite,Constraint,Mouse,MouseConstraint}=Matter;
const e=Engine.create();e.gravity.y=.35;
const w=innerWidth,h=innerHeight;
const r=Render.create({element:document.body,engine:e,options:{width:w,height:h,background:'#87ceeb',wireframes:false,pixelRatio:devicePixelRatio,hasBounds:true}});

// ── Cloud background (drawn over the canvas) ──
const clouds=[];
for(let i=0;i<8;i++){
  clouds.push({
    x:Math.random()*w,y:Math.random()*h*0.6,
    rx:50+Math.random()*120,ry:30+Math.random()*60,
    alpha:.15+Math.random()*.25
  });
}
// Custom render override for clouds
const origRender=r.render;
r.render=function(){
  origRender.call(this);
  const ctx=this.context;
  clouds.forEach(c=>{
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.rx,c.ry,0,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${c.alpha})`;ctx.fill();
    // secondary puffs
    ctx.beginPath();ctx.ellipse(c.x-c.rx*0.5,c.y-c.ry*0.3,c.rx*0.6,c.ry*0.7,0,0,Math.PI*2);
    ctx.fill();ctx.beginPath();ctx.ellipse(c.x+c.rx*0.5,c.y-c.ry*0.2,c.rx*0.5,c.ry*0.8,0,0,Math.PI*2);
    ctx.fill();
  });
};

// ── Audio ──
let ctrlReverb=.6,ctrlDecay=.4,ctrlHarm=.5,ctrlVol=.7,ctrlPitch='D3';
document.getElementById('reverb-ctrl').oninput=e=>ctrlReverb=e.target.value/100;
document.getElementById('decay-ctrl').oninput=e=>ctrlDecay=e.target.value/100;
document.getElementById('harm-ctrl').oninput=e=>ctrlHarm=e.target.value/100;
document.getElementById('vol-ctrl').oninput=e=>ctrlVol=e.target.value/100;
document.getElementById('pitch-ctrl').onchange=e=>ctrlPitch=e.target.value;

const masterRev=new Tone.Reverb({decay:15,wet:.5}).toDestination();
const masterDelay=new Tone.FeedbackDelay('8n',.12).connect(masterRev);

function noteFromPitch(p){const chromatic=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const oct=parseInt(p.slice(-1));const base=chromatic.indexOf(p.slice(0,-1));
  const midi=(oct+1)*12+base;return Tone.Frequency(midi,'midi').toFrequency();}

// Shape → unique voice
function createVoice(shape,pitch){
  const p=pitch||ctrlPitch;const base=noteFromPitch(p);
  const volVal=-8+(ctrlVol*12)-12;
  const harm=1+ctrlHarm*4;const dec=.2+ctrlDecay*3;
  switch(shape){
    case'circle':return{
      main:new Tone.MetalSynth({frequency:p,envelope:{attack:.003,decay:dec,release:dec*1.5},harmonicity:harm,modulationIndex:8+ctrlHarm*20,resonance:400,volume:volVal}).connect(masterDelay),
      ring:new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:.005,decay:dec*1.5,sustain:.05,release:dec*2},volume:volVal-8}).connect(masterDelay)};
    case'triangle':return{
      main:new Tone.PluckSynth({envelope:{attack:.001,decay:dec*.5,release:dec*.8},volume:volVal+2}).connect(masterDelay),
      ring:new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:.002,decay:dec*.8,release:dec},volume:volVal-4}).connect(masterDelay)};
    case'square':return{
      main:new Tone.MembraneSynth({frequency:p,envelope:{attack:.001,decay:dec*1.5,release:.5},pitchDecay:.05,octaves:3,volume:volVal-2}).connect(masterDelay),
      ring:new Tone.Synth({oscillator:{type:'square'},envelope:{attack:.003,decay:dec*.6,release:.4},volume:volVal-8}).connect(masterDelay)};
    case'hexagon':return{
      main:new Tone.FMSynth({harmonicity:harm,modulationIndex:12+ctrlHarm*20,envelope:{attack:.01,decay:dec,release:dec},volume:volVal+1}).connect(masterDelay),
      ring:new Tone.Synth({oscillator:{type:'sawtooth'},envelope:{attack:.003,decay:dec*.5,release:.3},volume:volVal-6}).connect(masterDelay)};
    case'poop':return{
      main:new Tone.MetalSynth({frequency:p,envelope:{attack:.001,decay:.8,release:1.5},harmonicity:0.5+ctrlHarm,modulationIndex:30,resonance:2000,volume:volVal+5}).connect(masterDelay),
      ring:new Tone.MonoSynth({oscillator:{type:'sawtooth'},envelope:{attack:.001,decay:.3,release:.8},volume:volVal-2}).connect(masterDelay)};
  }
}

// ── Hanging shapes (pulled down from top) ──
const anchorY=25;
const hShapes=[];let hIdx=0;
const hTypes=['circle','triangle','square','hexagon'];
const hColors=['#9b1b30','#c04c2c','#d4a017','#2b5f8a','#6b8e23','#4a3f6b','#1d6f7a','#7a4b6e'];

function createHangingShape(x,type){
  const t=type||hTypes[hIdx%hTypes.length];hIdx++;
  const color=hColors[hIdx%hColors.length];
  const pitch=['C3','D3','E3','G3','A3','C4','D4','E4','G4','A4'][Math.floor(Math.random()*10)];
  let body,size=25+Math.random()*20;
  switch(t){
    case'circle':body=Bodies.circle(x,anchorY+40,size,{density:.003,restitution:.4,friction:.3,render:{fillStyle:color,strokeStyle:'rgba(255,255,255,.15)',lineWidth:1},label:t});break;
    case'triangle':body=Bodies.polygon(x,anchorY+40,3,size,{density:.003,restitution:.35,friction:.3,render:{fillStyle:color,strokeStyle:'rgba(255,255,255,.15)',lineWidth:1},label:t});break;
    case'square':body=Bodies.rectangle(x,anchorY+40,size,size,{density:.004,restitution:.3,friction:.3,render:{fillStyle:color,strokeStyle:'rgba(255,255,255,.15)',lineWidth:1},label:t});break;
    case'hexagon':body=Bodies.polygon(x,anchorY+40,6,size,{density:.003,restitution:.4,friction:.3,render:{fillStyle:color,strokeStyle:'rgba(255,255,255,.15)',lineWidth:1},label:t});break;
    case'poop':body=Bodies.circle(x,anchorY+40,size,{density:.003,restitution:.6,friction:.1,render:{fillStyle:'#6b4a2e',strokeStyle:'rgba(255,200,150,.2)',lineWidth:1},label:'poop'});break;
  }
  const str=Constraint.create({pointA:{x,y:anchorY},bodyB:body,pointB:{x:0,y:-size*.8},stiffness:.6,damping:.05,length:8,render:{strokeStyle:'rgba(255,255,255,.2)',lineWidth:.5}});
  const voice=createVoice(t,pitch);
  const obj={body,str,voice,type:t,pitch,color};
  hShapes.push(obj);Composite.add(e.world,[body,str]);return obj;
}

// Create initial hanging shapes
const hangCount=7;
for(let i=0;i<hangCount;i++)createHangingShape((i+.5)/hangCount*w);

// ── Droppable shapes (click to spawn) ──
function dropShape(x,y,type){
  const voices={
    circle:createVoice('circle'),triangle:createVoice('triangle'),
    square:createVoice('square'),hexagon:createVoice('hexagon'),poop:createVoice('poop')
  };
  let body,size=18+Math.random()*16;
  const color=hColors[Math.floor(Math.random()*hColors.length)];
  switch(type){
    case'circle':body=Bodies.circle(x||.5*w,y||-30,size,{restitution:.6,density:.002,friction:.02,render:{fillStyle:color,strokeStyle:'rgba(255,255,255,.2)',lineWidth:1},label:'drop'});break;
    case'triangle':body=Bodies.polygon(x||.5*w,y||-30,3,size,{restitution:.5,density:.002,friction:.02,render:{fillStyle:color,strokeStyle:'rgba(255,255,255,.2)',lineWidth:1},label:'drop'});break;
    case'square':body=Bodies.rectangle(x||.5*w,y||-30,size,size,{restitution:.5,density:.003,friction:.02,render:{fillStyle:color,strokeStyle:'rgba(255,255,255,.2)',lineWidth:1},label:'drop'});break;
    case'hexagon':body=Bodies.polygon(x||.5*w,y||-30,6,size,{restitution:.6,density:.002,friction:.02,render:{fillStyle:color,strokeStyle:'rgba(255,255,255,.2)',lineWidth:1},label:'drop'});break;
    case'poop':body=Bodies.circle(x||.5*w,y||-30,size*1.2,{restitution:.7,density:.001,friction:.1,render:{fillStyle:'#6b4a2e',strokeStyle:'rgba(255,200,150,.15)',lineWidth:1},label:'drop'});break;
  }
  body._voice=voices[type];body._type=type;
  Composite.add(e.world,body);
}

// ── Collision sounds ──
let lastHit={};
Events.on(e,'collisionStart',ev=>{ev.pairs.forEach(p=>{
  const a=p.bodyA,b=p.bodyB;const now=Date.now();
  const hShape=a.label==='circle'||a.label==='triangle'||a.label==='square'||a.label==='hexagon'||a.label==='poop';
  const hShape2=b.label==='circle'||b.label==='triangle'||b.label==='square'||b.label==='hexagon'||b.label==='poop';
  // Dropped shape hits hanging shape
  if(a.label==='drop'&&hShape2){playHit(b,a);return;}
  if(b.label==='drop'&&hShape){playHit(a,b);return;}
  // Hanging shape hits another hanging shape
  if(hShape&&hShape2&&a!==b){playHit(a,b);}
})});

function playHit(hitBody,dropBody){
  const hs=hShapes.find(s=>s.body===hitBody);
  if(!hs)return;
  const v=dropBody?dropBody:hs.body;
  const speed=dropBody?Math.sqrt((hitBody.velocity.x-v.velocity.x)**2+(hitBody.velocity.y-v.velocity.y)**2)
    :Math.sqrt(hitBody.velocity.x**2+hitBody.velocity.y**2);
  const vel=Math.min(1,Math.max(.03,speed/15));
  const key=hs.body.id+'_'+Math.floor(now/200);if(lastHit[key])return;lastHit[key]=true;
  const pitch=hs.pitch;
  if(hs.voice.main){hs.voice.main.triggerAttackRelease(pitch,`.5+${vel*2}`,undefined,.3+vel*.4);}
  if(hs.voice.ring){hs.voice.ring.triggerAttackRelease(pitch,`1+${vel*2}`,undefined,.1+vel*.2);}
  Body.scale(hitBody,1.03,1.03);setTimeout(()=>Body.scale(hitBody,.97,.97),60);
}

// ── Spawn buttons ──
document.getElementById('btn-circle').onclick=()=>dropShape(null,null,'circle');
document.getElementById('btn-triangle').onclick=()=>dropShape(null,null,'triangle');
document.getElementById('btn-square').onclick=()=>dropShape(null,null,'square');
document.getElementById('btn-hexagon').onclick=()=>dropShape(null,null,'hexagon');
document.getElementById('btn-poop').onclick=()=>{
  for(let i=0;i<5;i++)setTimeout(()=>dropShape(w*Math.random(),-30-i*20,'poop'),i*100);
};

// Click on canvas to drop random shape
r.canvas.addEventListener('click',ev=>{
  const types=['circle','triangle','square','hexagon'];
  dropShape(ev.clientX,ev.clientY-30,types[Math.floor(Math.random()*4)]);
});

// Space = spawn poop rain
document.body.onkeyup=ev=>{
  if(ev.key===' '||ev.code==='Space'){
    for(let i=0;i<8;i++)setTimeout(()=>dropShape(w*Math.random()+30*(Math.random()-.5),-30-i*15,'poop'),i*80);
  }
};

// ── Mouse drag ──
const mouse=Mouse.create(r.canvas);
Composite.add(e.world,MouseConstraint.create(e,{mouse,constraint:{stiffness:.1,render:{visible:false}}}));
r.mouse=mouse;

// ── Walls (invisible, keep things inside) ──
Composite.add(e.world,[
  Bodies.rectangle(w/2,-25,w,50,{isStatic:true,isSensor:true,render:{visible:false}}),
  Bodies.rectangle(w/2,h+25,w,50,{isStatic:true,isSensor:true,render:{visible:false}}),
  Bodies.rectangle(-25,h/2,50,h,{isStatic:true,isSensor:true,render:{visible:false}}),
  Bodies.rectangle(w+25,h/2,50,h,{isStatic:true,isSensor:true,render:{visible:false}}),
]);

// ── Poop counter ──
let dropCount=0;const pc=document.getElementById('poop-count');
const origDrop=dropShape;dropShape=function(x,y,type){
  origDrop(x,y,type);
  if(type==='poop'){dropCount++;pc.textContent='💩'.repeat(Math.min(dropCount,10));}
};

Runner.run(Runner.create(),e);Render.run(r);
window.addEventListener('resize',()=>{r.canvas.width=window.innerWidth;r.canvas.height=window.innerHeight;});
</script></body></html>
