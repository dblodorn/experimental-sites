<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🐌 Clickholes Redux</title>
  <meta name="description" content="Click to create wormholes. Balls get sucked in. Space makes more balls.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: 'Courier New', monospace; }
    canvas { display: block; }
    #ui {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: #888; font-size: 14px; text-align: center; pointer-events: none;
      text-shadow: 0 0 8px rgba(0,0,0,.8); z-index: 10;
      background: rgba(0,0,0,.5); padding: 8px 20px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,.1);
    }
    #ui span { color: #f0f; }
    #count { color: #0ff; }
    #wormhole-count { color: #ff0; }
  </style>
</head>
<body>
  <div id="ui">🕳️ Click to create a <span>wormhole</span> &nbsp;·&nbsp; <span>Space</span> to spawn balls &nbsp;·&nbsp; Balls: <span id="count">0</span> &nbsp;·&nbsp; Holes: <span id="wormhole-count">0</span></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  <script>
    const { Engine, Render, Runner, Bodies, Body, Events, Composite, Mouse, MouseConstraint, Vector } = Matter;

    const engine = Engine.create();
    const w = window.innerWidth, h = window.innerHeight;
    const render = Render.create({
      element: document.body, engine,
      options: {
        width: w, height: h,
        background: '#0a0a0f', wireframes: false,
        pixelRatio: window.devicePixelRatio, hasBounds: true
      }
    });
    render.canvas.style.width = w + 'px';
    render.canvas.style.height = h + 'px';

    // Walls
    const wallOpts = { isStatic: true, render: { fillStyle: '#1a1a2e', strokeStyle: '#2a2a4e', lineWidth: 2 } };
    const walls = [
      Bodies.rectangle(w / 2, -25, w, 50, wallOpts),
      Bodies.rectangle(w / 2, h + 25, w, 50, wallOpts),
      Bodies.rectangle(-25, h / 2, 50, h, wallOpts),
      Bodies.rectangle(w + 25, h / 2, 50, h, wallOpts),
    ];
    Composite.add(engine.world, walls);

    // Mouse drag
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, { mouse });
    Composite.add(engine.world, mouseConstraint);
    render.mouse = mouse;

    // Audio
    const reverb = new Tone.Reverb({ decay: 10, wet: 0.6 }).toDestination();
    const synth = new Tone.FMSynth({
      harmonicity: 1.5, modulationIndex: 2,
      envelope: { attack: 0.01, decay: 0.3, release: 0.8 }
    }).connect(reverb);

    const holeSynth = new Tone.MetalSynth({
      envelope: { attack: 0.01, decay: 0.5, release: 0.3 },
      harmonicity: 8, modulationIndex: 40, resonance: 2000
    }).connect(new Tone.Reverb({ decay: 3, wet: 0.4 }).toDestination());

    let balls = [];
    let wormholes = [];
    const ballCountEl = document.getElementById('count');
    const holeCountEl = document.getElementById('wormhole-count');

    // Wormhole gravity fields
    Events.on(engine, 'beforeUpdate', () => {
      const gravity = 0.0005;
      wormholes.forEach(hole => {
        balls.forEach(ball => {
          const dx = hole.position.x - ball.position.x;
          const dy = hole.position.y - ball.position.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 5) {
            // Ball consumed!
            const idx = balls.indexOf(ball);
            if (idx > -1) {
              balls.splice(idx, 1);
              Composite.remove(engine.world, ball);
              ballCountEl.textContent = balls.length;

              // Whoosh sound
              const note = ['C3','D3','E3','G3','A3','C4'][Math.floor(Math.random()*6)];
              synth.triggerAttackRelease(note, '0.1');

              // Grow the hole briefly
              Body.scale(hole, 1.05, 1.05);
            }
            return;
          }
          const forceMag = gravity / (dist * dist + 10);
          const fx = dx * forceMag, fy = dy * forceMag;
          Body.applyForce(ball, ball.position, { x: fx, y: fy });
        });
      });
    });

    // Ball collision sounds
    Events.on(engine, 'collisionStart', (e) => {
      e.pairs.forEach(pair => {
        const a = pair.bodyA, b = pair.bodyB;
        if (a.label === 'Ball' || b.label === 'Ball') {
          const speed = Math.min(1, Math.sqrt(
            (a.velocity.x - b.velocity.x)**2 + (a.velocity.y - b.velocity.y)**2
          ) / 20);
          if (speed > 0.05) {
            const note = 200 + speed * 800;
            const vel = 0.1 + speed * 0.4;
            holeSynth.triggerAttackRelease(note, 0.05, undefined, vel);
          }
        }
        // Hole hit sound
        if (a.label === 'Wormhole' || b.label === 'Wormhole') {
          const note = ['C2','E2','G2'][Math.floor(Math.random()*3)];
          holeSynth.triggerAttackRelease(note, '0.15');
        }
      });
    });

    function createBall() {
      const colors = ['#ff006e','#fb5607','#ffbe0b','#8338ec','#3a86ff','#00bbf9'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const ball = Bodies.circle(
        Math.random() * w * 0.6 + w * 0.2, -30,
        Math.random() * 15 + 12,
        {
          restitution: 0.7, friction: 0.05, density: 0.002,
          render: { fillStyle: color, strokeStyle: '#fff', lineWidth: 1 },
          label: 'Ball'
        }
      );
      balls.push(ball);
      Composite.add(engine.world, ball);
      ballCountEl.textContent = balls.length;
      return ball;
    }

    function createWormhole(x, y) {
      const hole = Bodies.circle(x, y, 15, {
        isStatic: true,
        render: {
          fillStyle: '#000',
          strokeStyle: '#f0f',
          lineWidth: 3
        },
        label: 'Wormhole',
        plugin: { attractors: [] }
      });

      // Create orbit rings (visual only)
      const ring = Bodies.circle(x, y, 30, {
        isStatic: true, isSensor: true,
        render: { fillStyle: 'transparent', strokeStyle: 'rgba(255,0,255,0.3)', lineWidth: 1 },
        label: 'Ring'
      });
      const ring2 = Bodies.circle(x, y, 45, {
        isStatic: true, isSensor: true,
        render: { fillStyle: 'transparent', strokeStyle: 'rgba(255,0,255,0.1)', lineWidth: 1 },
        label: 'Ring'
      });

      wormholes.push(hole);
      Composite.add(engine.world, [hole, ring, ring2]);
      holeCountEl.textContent = wormholes.length;

      // Sound for wormhole open
      holeSynth.triggerAttackRelease('G2', '0.3');
    }

    // Spawn initial balls
    for (let i = 0; i < 5; i++) setTimeout(createBall, i * 200);

    // Click to create wormhole
    render.canvas.addEventListener('click', (e) => {
      createWormhole(e.clientX, e.clientY);
    });

    // Space to spawn ball
    document.body.onkeyup = (e) => {
      if (e.key === ' ' || e.code === 'Space') {
        for (let i = 0; i < 5; i++) setTimeout(createBall, i * 100);
      }
    };

    Runner.run(Runner.create(), engine);
    Render.run(render);
  </script>
</body>
</html>
